name: Update GitHub Stats

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Generate GitHub Stats
        run: |
          curl -o stats/stats.svg "https://github-readme-stats.vercel.app/api?username=OlgaDemidovich&show_icons=true&theme=dark&hide_title=true"
          
      - name: Generate Top Languages
        run: |
          curl -o stats/top-langs.svg "https://github-readme-stats.vercel.app/api/top-langs/?username=OlgaDemidovich&layout=compact&theme=dark"
          
      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add stats/
          git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update GitHub stats [skip ci]"
          git push
